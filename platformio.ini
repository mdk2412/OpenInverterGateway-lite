; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = ShineWifiX, ShineWifiS, nodemcu-32s, lolin32, d1
src_dir = SRC/ShineWiFi-ModBus
extra_configs =
    platformio-local.ini

[env]
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    "-Wno-comment"
lib_deps =
    jandrassy/ArduinoOTA@^1.1.1
    mlesniew/PicoMQTT@^1.3.0
    tzapu/WiFiManager@^2.0.17
    khoih-prog/ESP_DoubleResetDetector@^1.3.2
    bblanchon/ArduinoJson@^7.4.3
    bblanchon/StreamUtils@^1.9.2

[env:ShineWifiX]
platform = espressif8266@4.2.1
board = esp07s
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.2.2
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=1"
board_build.filesystem = littlefs

[env:ShineWifiS]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.1.0
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=1"

[env:d1]
platform = espressif8266@4.2.1
board = d1
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.2.2
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=0" 
    "-D LED_GN=2"
    "-D LED_GN_ACTIVE_LEVEL=0"
board_build.filesystem = littlefs   
    
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
lib_ignore=LittleFS_esp32
build_flags = 
    ${env.build_flags}

[env:lolin32]
platform = espressif32@6.12.0
board = lolin32_lite
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
lib_ignore=LittleFS_esp32
build_flags = 
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=0"

